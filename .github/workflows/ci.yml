name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

# ZAP, Nikto, and SQLMap are NOT run in CI because they require
# running Docker services as scan targets and produce large,
# environment-dependent output. Run them locally with `make test`.

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install pytest beautifulsoup4 requests flake8

      - name: PHP lint
        run: |
          sudo apt-get install -y php-cli
          find assignment-01-web-php-http/php -name "*.php" -exec php -l {} \;

      - name: Python compile check
        run: |
          find . -name "*.py" ! -path "./.venv/*" -exec python -m py_compile {} \;

      - name: Flake8 lint
        run: |
          flake8 --max-line-length=100 --exclude=.venv,venv .

      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          find . -name "*.sh" -exec shellcheck {} \;

      - name: pytest
        run: |
          python -m pytest \
            assignment-01-web-php-http/source-analysis/ \
            assignment-04-sqli/scripts/ \
            --tb=short -v

      - name: Validate docker-compose syntax
        run: |
          docker compose config -q

      - name: Markdown link check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          config-file: ".mlc-config.json"
        continue-on-error: true
