# Apache Directory Listing Disabled (Hardened Production Standard)
# Task 3: Enable/disable directory listing

<Directory /var/www/site-a/public_uploads>
    # -Indexes forbids the server from generating automated HTML index listings,
    # responding with HTTP 403 Forbidden if no index file is present.
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
