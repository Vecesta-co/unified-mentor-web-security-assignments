# Apache Directory Listing Enabled (Insecure Demonstration Configuration)
# Task 3: Enable/disable directory listing

<Directory /var/www/site-a/public_uploads>
    # +Indexes allows the server to generate automated HTML directory indexes
    # if no index.html or index.php file is present in the requested path.
    Options +Indexes
    AllowOverride None
    Require all granted
</Directory>
