# Apache Virtual Host: Site-B (Vulnerable XSS & Testing Testbed)
# Assignment 02 — Web Server Hosting & Hardening

Listen 8082

<VirtualHost *:8082>
    ServerName site-b.local
    ServerAdmin security@vecesta.co
    DocumentRoot /var/www/site-b

    ErrorLog ${APACHE_LOG_DIR}/site-b_error.log
    CustomLog ${APACHE_LOG_DIR}/site-b_access.log combined

    <Directory /var/www/site-b>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Permissive headers specifically to demonstrate unfiltered browser behaviors in lab testbed
        <IfModule mod_headers.c>
            Header set Access-Control-Allow-Origin "*"
            Header unset X-Frame-Options
        </IfModule>
    </Directory>

    ErrorDocument 403 /403.html
    ErrorDocument 404 /404.html
    ErrorDocument 500 /500.html
</VirtualHost>
