# Apache Virtual Host: Site-A (Primary Hardened Lab Application)
# Assignment 02 — Web Server Hosting & Hardening

<VirtualHost *:80>
    ServerName site-a.local
    ServerAlias localhost 127.0.0.1
    ServerAdmin security@vecesta.co
    DocumentRoot /var/www/site-a

    # Logging directives with format isolating vhost metrics
    ErrorLog ${APACHE_LOG_DIR}/site-a_error.log
    CustomLog ${APACHE_LOG_DIR}/site-a_access.log combined

    <Directory /var/www/site-a>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Security Headers
        <IfModule mod_headers.c>
            Header always set X-Frame-Options "SAMEORIGIN"
            Header always set X-Content-Type-Options "nosniff"
            Header always set X-XSS-Protection "1; mode=block"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header unset X-Powered-By
        </IfModule>
    </Directory>

    # Custom Error Pages
    ErrorDocument 403 /apache/403.html
    ErrorDocument 404 /apache/404.html
    ErrorDocument 500 /apache/500.html
</VirtualHost>
